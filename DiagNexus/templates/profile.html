<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - DiagNexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-10">

    <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-2xl border border-gray-100">
        
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <div class="flex items-center">
                <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold text-xl mr-4">
                    {{ user.username[0] | upper }}
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">My Profile</h2>
                    <p class="text-gray-500 text-sm">Manage your personal information</p>
                </div>
            </div>
            <a href="/" class="text-gray-500 hover:text-blue-600 transition">
                <i class="fas fa-arrow-left mr-2"></i> Back to Dashboard
            </a>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6 rounded">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/profile">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div class="col-span-1">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                    <input type="text" value="{{ user.username }}" disabled class="w-full px-4 py-2 border bg-gray-100 rounded-lg text-gray-500 cursor-not-allowed">
                </div>
                
                <div class="col-span-1">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                    <input type="text" value="{{ user.email }}" disabled class="w-full px-4 py-2 border bg-gray-100 rounded-lg text-gray-500 cursor-not-allowed">
                </div>

                <div class="col-span-1">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Phone Number</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fas fa-phone"></i>
                        </span>
                        <input type="tel" name="phone" value="{{ user.phone or '' }}" class="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Enter phone number">
                    </div>
                </div>

                <div class="col-span-1">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Age</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fas fa-birthday-cake"></i>
                        </span>
                        <input type="number" name="age" value="{{ user.age or '' }}" class="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Enter your age">
                    </div>
                </div>

                <div class="col-span-2">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Gender</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fas fa-venus-mars"></i>
                        </span>
                        <select name="gender" class="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition bg-white">
                            <option value="" disabled {% if not user.gender %}selected{% endif %}>Select Gender</option>
                            <option value="Male" {% if user.gender == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if user.gender == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if user.gender == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex justify-end">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-lg transition transform hover:-translate-y-0.5">
                    Save Changes
                </button>
            </div>
        </form>
    </div>

</body>
</html>
