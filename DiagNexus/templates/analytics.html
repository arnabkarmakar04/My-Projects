<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Portal - Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dropdown-menu { transition: all 0.2s ease-in-out; transform-origin: top right; transform: scale(0.95); opacity: 0; pointer-events: none; }
        .dropdown-menu.active { transform: scale(1); opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex">

    <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:flex">
        <div class="p-6 text-2xl font-bold tracking-wider border-b border-gray-800">
            Diag<span class="text-blue-500">Nexus</span>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="/admin" class="block py-2.5 px-4 rounded hover:bg-gray-800 text-gray-400 transition">
                <i class="fas fa-tachometer-alt mr-2"></i> Dashboard
            </a>
            <a href="/admin/users" class="block py-2.5 px-4 rounded hover:bg-gray-800 text-gray-400 transition">
                <i class="fas fa-users mr-2"></i> User Management
            </a>
            <a href="/admin/analytics" class="block py-2.5 px-4 rounded bg-blue-600 text-white transition">
                <i class="fas fa-chart-line mr-2"></i> Analytics
            </a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
            <h2 class="text-xl font-bold text-gray-800">Deep Dive Analytics</h2>
            
            <div class="relative">
                <button onclick="document.getElementById('profileDropdown').classList.toggle('active')" class="flex items-center space-x-3 focus:outline-none hover:bg-gray-50 p-2 rounded-lg transition">
                    <span class="text-sm font-bold text-gray-800">{{ user.username }}</span>
                    <div class="w-10 h-10 bg-gray-800 text-white rounded-full flex items-center justify-center border-2 border-white shadow-sm"><i class="fas fa-user-shield"></i></div>
                </button>
                <div id="profileDropdown" class="dropdown-menu absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-gray-100 z-50">
                    <div class="p-2">
                        <a href="/admin" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50">Back to Dashboard</a>
                        <a href="/logout" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50">Logout</a>
                    </div>
                </div>
            </div>
        </header>

        <main class="p-6 overflow-y-auto">
            
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8">
                <h3 class="font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fas fa-chart-line text-green-500 mr-2"></i> Revenue Growth (Last 30 Days)
                </h3>
                <div class="relative h-72 w-full">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-800 mb-4 flex items-center">
                        <i class="fas fa-chart-pie text-blue-500 mr-2"></i> Bill Status Distribution
                    </h3>
                    <div class="relative h-64 w-full flex justify-center">
                        <canvas id="statusChart"></canvas>
                    </div>
                    <p class="text-center text-xs text-gray-400 mt-4">Shows approval vs rejection rates.</p>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-800 mb-4 flex items-center">
                        <i class="fas fa-store text-purple-500 mr-2"></i> Most Popular Pharmacies
                    </h3>
                    <div class="relative h-64 w-full">
                        <canvas id="vendorChart"></canvas>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script id="chart-data" type="application/json">
    {
        "trendLabels": {{ trend_labels | tojson }},
        "trendValues": {{ trend_values | tojson }},
        "statusLabels": {{ status_labels | tojson }},
        "statusValues": {{ status_values | tojson }},
        "vendorLabels": {{ vendor_labels | tojson }},
        "vendorValues": {{ vendor_values | tojson }}
    }
    </script>

    <script>
        // Read the clean JSON from the data block
        const rawData = document.getElementById('chart-data').textContent;
        const chartData = JSON.parse(rawData);

        // A. Revenue Line Chart
        const ctxRev = document.getElementById('revenueChart').getContext('2d');
        new Chart(ctxRev, {
            type: 'line',
            data: {
                labels: chartData.trendLabels,
                datasets: [{
                    label: 'Total Revenue (₹)',
                    data: chartData.trendValues,
                    borderColor: '#10b981', 
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // B. Status Pie Chart
        const ctxStat = document.getElementById('statusChart').getContext('2d');
        new Chart(ctxStat, {
            type: 'doughnut',
            data: {
                labels: chartData.statusLabels,
                datasets: [{
                    data: chartData.statusValues,
                    backgroundColor: ['#10b981', '#ef4444', '#f59e0b'],
                    hoverOffset: 4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // C. Vendor Bar Chart
        const ctxVen = document.getElementById('vendorChart').getContext('2d');
        new Chart(ctxVen, {
            type: 'bar',
            data: {
                labels: chartData.vendorLabels,
                datasets: [{
                    label: 'Orders Count',
                    data: chartData.vendorValues,
                    backgroundColor: '#6366f1',
                    borderRadius: 4
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
            }
        });
    </script>
</body>
</html>
