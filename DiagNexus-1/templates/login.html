<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DiagNexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen transition-colors duration-500" id="body-bg">
    
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md relative overflow-hidden">
        
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold mb-2 text-gray-800" id="page-title">Welcome Back</h2>
            <p class="text-gray-500 text-sm">Please choose your login type</p>
            
            <div class="flex justify-center mt-6 bg-gray-200 p-1 rounded-lg inline-flex">
                <button onclick="switchRole('user')" id="btn-user" class="px-6 py-2 rounded-md text-sm font-semibold bg-white shadow-sm text-blue-600 transition-all">
                    Patient / User
                </button>
                <button onclick="switchRole('admin')" id="btn-admin" class="px-6 py-2 rounded-md text-sm font-semibold text-gray-500 hover:text-gray-700 transition-all">
                    Administrator
                </button>
            </div>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4 text-sm" role="alert">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="fade-in">
            <input type="hidden" name="login_type" id="login_type" value="user">

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </span>
                    <input type="text" name="username" class="w-full pl-10 pr-3 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </span>
                    <input type="password" name="password" class="w-full pl-10 pr-3 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 shadow-lg transition transform hover:-translate-y-0.5">
                Login as User
            </button>
        </form>

        <div id="register-link" class="mt-6 text-center text-sm text-gray-600">
            New to DiagNexus? <a href="/register" class="text-blue-600 font-bold hover:underline">Create Account</a>
        </div>
    </div>

    <script>
        function switchRole(role) {
            const body = document.getElementById('body-bg');
            const btnUser = document.getElementById('btn-user');
            const btnAdmin = document.getElementById('btn-admin');
            const submitBtn = document.getElementById('submit-btn');
            const loginTypeInput = document.getElementById('login_type');
            const registerLink = document.getElementById('register-link');
            const title = document.getElementById('page-title');

            if (role === 'admin') {
                // Admin Styling
                body.classList.replace('bg-gray-100', 'bg-gray-800');
                
                btnAdmin.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
                btnAdmin.classList.remove('text-gray-500');
                
                btnUser.classList.remove('bg-white', 'shadow-sm', 'text-blue-600');
                btnUser.classList.add('text-gray-500');

                submitBtn.classList.replace('bg-blue-600', 'bg-gray-800');
                submitBtn.classList.replace('hover:bg-blue-700', 'hover:bg-gray-900');
                submitBtn.innerText = "Access Admin Panel";
                
                title.innerText = "Admin Portal";
                loginTypeInput.value = 'admin';
                registerLink.classList.add('hidden'); // Admins usually don't self-register
            } else {
                // User Styling
                body.classList.replace('bg-gray-800', 'bg-gray-100');

                btnUser.classList.add('bg-white', 'shadow-sm', 'text-blue-600');
                btnUser.classList.remove('text-gray-500');

                btnAdmin.classList.remove('bg-white', 'shadow-sm', 'text-gray-900');
                btnAdmin.classList.add('text-gray-500');

                submitBtn.classList.replace('bg-gray-800', 'bg-blue-600');
                submitBtn.classList.replace('hover:bg-gray-900', 'hover:bg-blue-700');
                submitBtn.innerText = "Login as User";

                title.innerText = "Welcome Back";
                loginTypeInput.value = 'user';
                registerLink.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
